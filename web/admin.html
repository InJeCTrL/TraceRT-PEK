<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>TraceRT-PEK 算路后台</title>
  <style>
    *{box-sizing:border-box}[hidden]{display:none!important}:root{color-scheme:light;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#f3f6f9}body{margin:0;min-height:100vh}button,input,select{font:inherit}button{cursor:pointer;border:0}
    .topbar{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;background:#fff;border-bottom:1px solid #e3e8ef;position:sticky;top:0;z-index:20}.brand{display:flex;align-items:baseline;gap:10px}.brand b{font-size:19px}.brand span{font-size:12px;color:#788496}.top-actions{display:flex;gap:9px}.button{padding:9px 13px;border-radius:8px;background:#e9eef5;color:#263449;text-decoration:none;font-weight:650;font-size:13px}.button.primary{background:#1677ff;color:#fff}.button.danger{background:#fff1f0;color:#c43226}
    .page{padding:20px 24px 32px;max-width:1680px;margin:auto}.summary{display:grid;grid-template-columns:repeat(3,minmax(130px,1fr));gap:12px;margin-bottom:16px}.card{background:#fff;border:1px solid #e3e8ef;border-radius:12px;padding:15px 17px;box-shadow:0 2px 10px #1720330a}.card b{display:block;font-size:25px;line-height:1.1}.card span{font-size:12px;color:#778397}.card.failed b{color:#c43226}.card.success b{color:#0d9965}
    .toolbar{display:grid;grid-template-columns:minmax(220px,1fr) 150px auto;gap:9px;margin-bottom:12px}.toolbar input,.toolbar select{height:40px;border:1px solid #d6dde6;border-radius:8px;background:#fff;padding:0 11px;color:#263449;outline:none}.toolbar input:focus,.toolbar select:focus{border-color:#1677ff;box-shadow:0 0 0 3px #1677ff16}.toolbar .button{height:40px}
    .table-wrap{background:#fff;border:1px solid #e3e8ef;border-radius:12px;overflow:auto;box-shadow:0 2px 10px #1720330a}table{width:100%;border-collapse:collapse;min-width:1040px}th{text-align:left;font-size:11px;color:#687589;background:#f8fafc;padding:11px 12px;border-bottom:1px solid #e3e8ef;white-space:nowrap}td{padding:12px;border-bottom:1px solid #eef1f5;font-size:12px;vertical-align:middle}tbody tr{cursor:pointer}tbody tr:hover{background:#f5f9ff}tbody tr:last-child td{border:0}.route-name{display:grid;gap:4px;max-width:310px}.route-name b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.route-name small{color:#7a8696}.badge{display:inline-flex;align-items:center;padding:4px 7px;border-radius:999px;font-size:11px;font-weight:700;white-space:nowrap}.badge.ok{background:#eaf8f2;color:#087d53}.badge.bad{background:#fff0ee;color:#b42318}.badge.warn{background:#fff6df;color:#a76005}.badge.muted{background:#edf1f5;color:#5e6b7e}.empty{padding:70px 20px;text-align:center;color:#7a8696}.pager{display:flex;align-items:center;justify-content:space-between;padding:12px 2px;color:#6e7b8d;font-size:12px}.pager-actions{display:flex;gap:8px}.pager .button:disabled{opacity:.45;cursor:default}
    .drawer-shell{position:fixed;inset:0;z-index:100;background:#10182866;display:flex;justify-content:flex-end}.drawer{width:min(760px,100%);height:100%;overflow:auto;background:#f7f9fc;box-shadow:-18px 0 50px #0003}.drawer-head{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 20px;background:#fff;border-bottom:1px solid #e3e8ef;position:sticky;top:0;z-index:3}.drawer-head h2{font-size:17px;margin:0}.close{width:36px;height:36px;border-radius:8px;background:#edf1f5;font-size:20px}.detail{padding:16px;display:grid;gap:13px}.detail-card{background:#fff;border:1px solid #e2e7ee;border-radius:12px;padding:15px}.detail-card h3{font-size:14px;margin:0 0 12px}.detail-status{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.detail-status .record-id{font:11px ui-monospace,SFMono-Regular,Menlo,monospace;color:#778397}.detail-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px 18px}.detail-item{min-width:0}.detail-item span{display:block;font-size:10px;color:#7a8696;margin-bottom:3px}.detail-item b{display:block;font-size:13px;overflow-wrap:anywhere}.wide{grid-column:1/-1}#detail-map{height:300px;border-radius:10px;overflow:hidden;background:#e9edf2}.event{border-left:3px solid #f59e0b;padding:1px 0 1px 12px;margin:13px 0}.event:first-of-type{margin-top:0}.event:last-child{margin-bottom:0}.event.strong{border-color:#dc2626}.event h4{margin:0 0 5px;font-size:13px}.event p{margin:3px 0;color:#5f6c7e;font-size:12px;line-height:1.55}.metrics{display:flex;gap:7px;flex-wrap:wrap}.metrics code{font-size:11px;background:#f0f3f7;border-radius:5px;padding:4px 6px;color:#3d4a5d}.error-box{background:#fff2f0;color:#a9251b;border:1px solid #ffc8c2;border-radius:9px;padding:11px;font-size:12px;line-height:1.6;overflow-wrap:anywhere}.raw{font:11px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;white-space:pre-wrap;overflow-wrap:anywhere;color:#435166;background:#f5f7fa;border-radius:8px;padding:10px;max-height:260px;overflow:auto}
    @media(max-width:760px){.topbar{height:auto;padding:12px 14px;gap:12px}.brand{display:grid;gap:1px}.page{padding:12px}.summary{grid-template-columns:repeat(2,1fr);gap:8px}.card{padding:12px}.toolbar{grid-template-columns:1fr 1fr}.toolbar input{grid-column:1/-1}.toolbar .button{grid-column:1/-1}.detail-grid{grid-template-columns:repeat(2,minmax(0,1fr))}#detail-map{height:240px}.drawer-head{height:56px}.top-actions .button.danger{display:none}}
  </style>
</head>
<body>
  <header class="topbar"><div class="brand"><b>算路记录后台</b><span>TraceRT-PEK 高德路线记录</span></div><div class="top-actions"><a class="button" href="/">返回路线规划</a><button class="button" id="refresh">刷新</button><button class="button danger" id="clear-all">清空记录</button></div></header>
  <main class="page">
    <p><a class="button" href="/admin-diagnostics.html">定位诊断</a></p>
    <section class="summary"><div class="card"><b id="total-count">0</b><span>全部算路</span></div><div class="card success"><b id="success-count">0</b><span>成功</span></div><div class="card failed"><b id="failed-count">0</b><span>失败</span></div></section>
    <section class="toolbar"><input id="search" placeholder="搜索起点、终点、记录 ID、错误"><select id="status-filter"><option value="all">全部结果</option><option value="success">仅成功</option><option value="failed">仅失败</option></select><button class="button primary" id="apply-filter">查询</button></section>
    <section class="table-wrap"><table><thead><tr><th>时间</th><th>结果</th><th>起点 → 终点</th><th>路线类型</th><th>距离 / 时间</th><th>计算次数</th><th>算路耗时</th></tr></thead><tbody id="records"></tbody></table><div class="empty" id="empty" hidden>暂无算路记录</div></section>
    <div class="pager"><span id="page-info">第 0–0 条</span><div class="pager-actions"><button class="button" id="previous">上一页</button><button class="button" id="next">下一页</button></div></div>
  </main>
  <div class="drawer-shell" id="drawer" hidden><aside class="drawer"><header class="drawer-head"><h2>导航详情</h2><button class="close" id="close-detail" aria-label="关闭">×</button></header><div class="detail" id="detail"></div></aside></div>
  <script>window._AMapSecurityConfig=__AMAP_SECURITY_CONFIG__;</script>
  <script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_JS_KEY__"></script>
  <script src="/admin.js"></script>
</body>
</html>
