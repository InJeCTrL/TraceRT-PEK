<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <title>TraceRT-PEK 路线规划</title>
  <style>
    *{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0;overflow:hidden;font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;color:#172033;background:#fff}
    button,input{font:inherit}button{border:0;border-radius:8px;padding:10px 12px;font-weight:650;cursor:pointer;background:#e9eef5;color:#233044}button:hover{filter:brightness(.97)}
    #app{display:flex;flex-direction:column;height:100%;height:100dvh}.panel{position:relative;z-index:30;background:rgba(255,255,255,.96);box-shadow:0 2px 12px rgba(23,32,51,.12);backdrop-filter:blur(16px) saturate(140%);-webkit-backdrop-filter:blur(16px) saturate(140%)}
    .panel-content{padding:9px 14px 7px;display:grid;grid-template-columns:minmax(480px,2fr) minmax(330px,1fr);gap:9px 14px;align-items:stretch}.panel-toggle{display:block;width:100%;height:22px;margin:0;padding:0;border-radius:0;border-top:1px solid #d9e0e8;background:#f7f9fb;color:#536174;font-size:11px;line-height:21px}.panel.collapsed .panel-content{display:none}.route-fields{display:grid;grid-template-columns:minmax(0,1fr) 42px;gap:6px 10px;align-items:end}.route-fields .field{grid-column:1}.route-fields .field:nth-child(2){grid-row:2}.field{margin:0}.label{display:flex;justify-content:space-between;font-size:13px;font-weight:650;margin-bottom:4px}.selected-note{color:#138a5b;font-size:11px;font-weight:500}.input-row{display:flex;gap:7px}.search-box{position:relative;flex:1}input{width:100%;min-width:0;border:1px solid #ccd4decc;background:#ffffffb8;border-radius:8px;padding:10px 12px;font-size:14px;outline:none}input:focus{border-color:#1677ff;box-shadow:0 0 0 3px #1677ff18}
    .use-current,.swap-button{display:grid;place-items:center;width:40px;height:40px;flex:0 0 40px;padding:0;color:#526174;background:#ffffffc4;border:1px solid #ccd4decc}.use-current svg,.swap-button svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}.swap-button{grid-column:2;grid-row:1/3;align-self:center;border-radius:50%;box-shadow:0 3px 10px #1720331f}
    .suggestions{display:none;position:absolute;left:0;right:0;top:calc(100% + 5px);z-index:3000;background:#fff;border:1px solid #d6dde6;border-radius:9px;box-shadow:0 10px 30px #17203325;max-height:230px;overflow:auto}.suggestions.open{display:block}.suggestion{padding:10px 11px;border-bottom:1px solid #edf0f3;cursor:pointer;font-size:12px;line-height:1.4}.suggestion:hover{background:#f0f6ff}.suggestion b{display:block;font-size:13px}.suggestion small{color:#748091}
    .command-row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-rows:minmax(44px,1fr) auto;column-gap:8px;row-gap:3px;min-height:0}.command-row .primary{background:#1677ff;color:#fff}.command-row .primary,.command-row .exit,.command-row .reset{height:100%;min-height:44px}.command-row .primary,.command-row .exit{width:100%}.exit{background:#0d9b68;color:#fff}.reset{min-width:72px}.data-attribution{grid-column:1/-1;justify-self:center;align-self:end;color:#697586;font-size:10px;line-height:12px;white-space:nowrap}.status{grid-column:1/-1;margin:0;padding:8px 10px;background:#f5f7fa;border:1px solid #e2e7ed;border-radius:10px;font-size:12px;line-height:1.45}.status.error{color:#b42318;background:#fff4f2;border-color:#ffc7c0}
    #map{flex:1 1 auto;min-height:0;width:100%}.amap-logo,.amap-copyright{display:none!important}.amap-local-controls{position:absolute;z-index:20;left:12px;bottom:18px;display:grid;border-radius:7px;overflow:hidden;box-shadow:0 3px 12px #17203347}.amap-local-controls button{width:52px;height:47px;border-radius:0;background:#fff;font-size:25px;padding:0;border-bottom:1px solid #e5e7eb}.amap-local-controls button:last-child{border-bottom:0}.amap-local-controls .follow-control{position:relative;overflow:hidden;background:#ecfdf3;color:#079455}.amap-local-controls .follow-control:before,.amap-local-controls .follow-control:after{content:"";position:absolute;left:16px;top:13px;width:20px;height:20px;border-radius:50%;background:#12b16633;animation:wave 2s ease-out infinite}.amap-local-controls .follow-control:after{animation-delay:1s}@keyframes wave{0%{transform:scale(.15);opacity:.85}100%{transform:scale(3.3);opacity:0}}.control-icon,.control-label{position:relative;z-index:2;display:block}.control-icon{font-size:23px;line-height:23px}.control-icon svg{width:24px;height:24px;fill:none;stroke:#263449;stroke-width:1.7}.control-icon .compass-north{fill:#e5484d;stroke:#a9282d}.control-icon .compass-south{fill:#263449;stroke:#172033}.control-label{font-size:9px;line-height:11px}.orientation-control.head-up .control-icon{transform:rotate(-25deg)}.map-display-controls{position:absolute;z-index:20;right:12px;bottom:18px;display:grid;justify-items:end;gap:7px;color:#46546a}.map-display-option{display:grid;grid-template-columns:auto 42px auto;align-items:center;gap:5px;height:36px;padding:0 9px;border:1px solid #d7dee7;border-radius:10px;background:#fffffff0;box-shadow:0 2px 8px #17203324;font-size:12px;white-space:nowrap}.map-display-option.single{grid-template-columns:auto 42px}.map-display-option .left{text-align:right}.map-display-option .right{text-align:left}.toggle-switch{position:relative;width:42px;height:24px;padding:0;border:0;border-radius:999px;background:#c7d0dc;box-shadow:inset 0 1px 2px #17203330;transition:background .16s}.toggle-switch:after{content:"";position:absolute;left:2px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px #17203355;transition:transform .16s}.toggle-switch.on{background:#1677ff}.toggle-switch.on:after{transform:translateX(18px)}
    .current-position-pulse{position:relative;width:46px;height:46px;pointer-events:none;user-select:none}.current-position-pulse:before,.current-position-pulse:after{content:"";position:absolute;inset:9px;border-radius:50%;background:#12b16666;animation:location-wave 2s ease-out infinite}.current-position-pulse:after{animation-delay:1s}@keyframes location-wave{0%{transform:scale(.45);opacity:.9}100%{transform:scale(2.45);opacity:0}}.point-menu{display:grid;gap:4px;background:#fff;border-radius:9px;padding:7px;box-shadow:0 8px 28px #17203335;min-width:150px;max-width:min(270px,calc(100vw - 24px))}.point-menu button{text-align:left;background:#fff;padding:9px 10px}.point-menu small{padding:4px 8px 7px;color:#718096}.camera-menu em{color:#079455;font-style:normal}.camera-correction-edit-point{width:18px;height:18px;border:2px solid #fff;border-radius:50%;background:#f2b514;box-shadow:0 0 0 1px #bd8100,0 2px 7px #6d4b005c;pointer-events:none}.camera-correction-pedal{position:relative;width:124px;height:47px;display:flex;align-items:center;justify-content:center;gap:9px;border:2px solid #9b6900;border-radius:12px;background:linear-gradient(180deg,#ffd75a 0%,#efb619 54%,#cb8e00 100%);box-shadow:inset 0 1px 0 #fff1a8,inset 0 -4px 0 #986500,0 5px 10px #5f430042;color:#523600;font-size:12px;font-weight:780;letter-spacing:.04em;cursor:grab;user-select:none;-webkit-user-select:none;touch-action:none;transform:perspective(110px) rotateX(5deg);transform-origin:top center}.camera-correction-pedal:before,.camera-correction-pedal:after{content:"";position:absolute;top:7px;bottom:10px;width:4px;border-radius:3px;background:#8c5c005c}.camera-correction-pedal:before{left:10px}.camera-correction-pedal:after{right:10px}.camera-correction-pedal.dragging{cursor:grabbing;transform:perspective(110px) rotateX(2deg) translateY(2px);filter:brightness(.96)}.pedal-grip{width:25px;height:19px;border-radius:5px;background:repeating-linear-gradient(90deg,#5f3f0000 0 3px,#5f3f0066 3px 5px);border:1px solid #80550042}.camera-correction-actions{display:flex;align-items:center;border:1px solid #f2cf73;border-radius:11px;background:#fff;box-shadow:0 6px 18px #684b1538;overflow:hidden}.camera-correction-actions button{height:40px;border-radius:0;padding:0 12px;font-weight:750;white-space:nowrap}.camera-correction-actions .lock-correction{display:flex;align-items:center;gap:5px;background:#efb619;color:#4f3500}.camera-correction-actions .lock-icon{font-size:13px;filter:grayscale(1)}.camera-correction-actions .cancel-correction{width:38px;padding:0;border-left:1px solid #f0d797;background:#fff;color:#765000;font-size:21px}.camera-correction-actions button:disabled{opacity:.65}.amap-info-content{padding:0!important}.amap-info-sharp{display:none}.safe-gateway{width:26px;height:26px;border:4px solid #fff;border-radius:50%;background:#15a263;box-shadow:0 2px 9px #075c378c}
    .modal{display:none;position:fixed;inset:0;z-index:5000;background:#10182866;align-items:center;justify-content:center;padding:20px}.modal.open{display:flex}.dialog{width:min(520px,100%);max-height:82vh;overflow:auto;background:#fff;border-radius:13px;padding:22px;box-shadow:0 20px 60px #0004}.dialog h2{margin:0 0 10px;font-size:18px}.result-message{margin:0;color:#27364a;font-size:15px;line-height:1.7}.result-metrics{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:15px;padding-top:14px;border-top:1px solid #e4e9ef}.result-metrics b{display:block;font-size:18px}.result-metrics span{font-size:11px;color:#718096}.gateway-info{margin-top:14px;padding:11px 12px;border-radius:9px;background:#f1f8f4;color:#245d43;font-size:12px;line-height:1.55}.gateway-info b{display:block;font-size:13px}.dialog-actions{display:flex;gap:9px;margin-top:18px}.dialog-actions button{flex:1}.dialog-actions .primary{background:#1677ff;color:#fff}
    @media(max-width:900px){.panel-content{grid-template-columns:1fr;padding:7px 9px 6px;gap:7px}.route-fields{grid-template-columns:minmax(0,1fr) 36px;gap:5px 7px}.swap-button{width:34px;height:34px}.label{font-size:11px;margin-bottom:2px}input{padding:7px 9px;font-size:12px}.use-current{width:34px;height:34px;flex-basis:34px}.command-row{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;grid-template-rows:42px auto;column-gap:6px;row-gap:1px}.command-row button{padding:8px 6px;font-size:11px}.command-row .primary,.command-row .exit,.command-row .reset{height:42px;min-height:42px}.reset{min-width:54px}.data-attribution{font-size:9px;line-height:11px}.suggestions{max-height:150px}.amap-local-controls{bottom:10px}.map-display-controls{right:8px;bottom:10px;gap:6px}.map-display-option{grid-template-columns:auto 40px auto;gap:4px;height:34px;padding:0 8px;font-size:11px}.map-display-option.single{grid-template-columns:auto 40px}.toggle-switch{width:40px;height:22px}.toggle-switch:after{width:18px;height:18px}.toggle-switch.on:after{transform:translateX(18px)}}
    .location-health{position:absolute;z-index:25;top:50%;left:50%;transform:translateX(-50%);padding:7px 12px;border-radius:8px;background:#fff4e5;color:#8a4b08;font-size:12px;box-shadow:0 2px 8px #17203324;pointer-events:none;white-space:nowrap}
    .command-row button:disabled{opacity:.45;cursor:default;filter:none}
  </style>
</head>
<body>
<div id="app">
  <aside class="panel" id="panel"><div class="panel-content">
    <div class="route-fields">
      <div class="field"><div class="label"><span>起点 <i class="selected-note" id="start-selected"></i></span></div><div class="input-row"><div class="search-box"><input id="start" autocomplete="off" placeholder="正在获取当前位置…"><div class="suggestions" id="start-suggestions"></div></div><button class="use-current" id="use-current-start" title="使用当前位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" opacity=".35"/></svg></button></div></div>
      <div class="field"><div class="label"><span>终点 <i class="selected-note" id="end-selected"></i></span></div><div class="input-row"><div class="search-box"><input id="end" autocomplete="off" placeholder="输入地名并选择坐标"><div class="suggestions" id="end-suggestions"></div></div><button class="use-current" id="use-current-end" title="使用当前位置"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/><circle cx="12" cy="12" r="9" opacity=".35"/></svg></button></div></div>
      <button class="swap-button" id="swap-points" title="调转起终点"><svg viewBox="0 0 24 24"><path d="M7 3v15M3.5 14.5 7 18l3.5-3.5M17 21V6m-3.5 3.5L17 6l3.5 3.5"/></svg></button>
    </div>
    <div class="command-row"><button class="primary" id="route">计算路径</button><button class="exit" id="exit">一键从起点出六环</button><button class="reset" id="clear">重置</button><div class="data-attribution" id="camera-updated-at">摄像头数据更新时间：正在读取…</div></div>
    <div class="status" id="status" hidden></div>
  </div><button class="panel-toggle" id="panel-toggle">收起路线栏 ▲</button></aside>
  <main id="map"></main>
</div>
<div class="modal" id="result-modal"><div class="dialog"><h2>路线提示</h2><p class="result-message" id="result-message"></p><div class="gateway-info" id="gateway-info" hidden><b id="gateway-label"></b><span id="gateway-coordinate"></span></div><div class="result-metrics" id="result-metrics" hidden><div><b id="result-distance">—</b><span>路线距离</span></div><div><b id="result-duration">—</b><span>预估行驶时间</span></div><div><b id="result-query">—</b><span>计算次数</span></div><div><b id="result-elapsed">—</b><span>算路时间</span></div></div><div class="dialog-actions"><button id="copy-gateway" hidden>复制接驳点</button><button class="primary" id="result-close">知道了</button></div></div></div>
<script>window._AMapSecurityConfig=__AMAP_SECURITY_CONFIG__;</script>
<script src="https://webapi.amap.com/maps?v=2.0&key=__AMAP_JS_KEY__"></script>
<script src="/location-filter.js?v=20260913-2"></script>
<script src="/location-diagnostics.js?v=20260913-1"></script>
<script src="/amap-app.js?v=20260913-4"></script>
</body></html>
