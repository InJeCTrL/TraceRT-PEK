name: Test and Publish Image

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test application
        run: |
          python -m unittest discover -s tests -p 'test_*.py'
          node --check web/amap-app.js
          node --check web/admin.js
          node tests/location-recovery.cjs
          node tests/location-filter.cjs
          node tests/location-timer-binding.cjs
          node tests/amap-location.cjs
      - name: Validate Compose with dummy credentials
        env:
          AMAP_API_KEY: ci-placeholder
          AMAP_JS_KEY: ci-placeholder
          AMAP_JS_SECURITY_CODE: ci-placeholder
          ADMIN_PASSWORD: ci-placeholder
        run: docker compose config --quiet
      - name: Reject private runtime artifacts
        run: |
          python - <<'PY'
          import subprocess
          from pathlib import PurePosixPath
          files = subprocess.check_output(['git', 'ls-files', '-z']).decode().split('\0')
          forbidden = []
          for name in filter(None, files):
              path = PurePosixPath(name)
              if ((path.name.startswith('.env') and path.name != '.env.example')
                  or path.name in ('.amap-key', '.admin-password', 'camera_corrections.json')
                  or '.sqlite3' in path.name or path.suffix in ('.log', '.pid', '.pem', '.key')
                  or path.parts[0] in ('archive', 'backups', 'logs', '.osm-cache', '.tile-cache')):
                  forbidden.append(name)
          if forbidden:
              raise SystemExit('Private artifacts in repository: ' + ', '.join(forbidden))
          PY

  publish:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Generate image tags
        id: image
        shell: bash
        run: |
          echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "timestamp=$(date -u +%Y%m%d%H%M%S)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GHCR
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ steps.image.outputs.timestamp }}
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=GPL-3.0-only
          cache-from: type=gha
          cache-to: type=gha,mode=max
